<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#07090A" />
    <script>
      /* Applies the theme class before React mounts so the dark canvas never
       * flashes white. Mirrors `theme-provider.tsx`: stored `light` / `dark`
       * win, stored `system` follows the OS, and anything else (including no
       * stored value) falls back to the dark-first default. */
      ;(function () {
        var mode = null
        try {
          mode = window.localStorage.getItem('newapi:theme:v1:mode')
        } catch (error) {
          mode = null
        }
        var resolved
        if (mode === 'light' || mode === 'dark') {
          resolved = mode
        } else if (mode === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        } else {
          resolved = 'dark'
        }
        document.documentElement.classList.add(resolved)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
